# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: My 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  flutter_card_swiper: ^7.2.0 #Made by: ricardodalarme.com
  device_preview: ^1.3.1

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0 #Made by: flutter.dev


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true


  assets:
  - assets/images/ #Made by: Angel5l 

  fonts:
    - family: Merriweather
      fonts:
        - asset: fonts/Merriweather_24pt-Regular.ttf
          weight : 400
    - family: Playfair Display
      fonts:
        - asset: fonts/PlayfairDisplay-Regular.ttf
          weight : 400
    - family: Spectral
      fonts:
        - asset: fonts/Spectral-Light.ttf
          weight : 400
